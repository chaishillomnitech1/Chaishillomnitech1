name: Contribution Points (Simulation Only)

on:
  pull_request:
    types: [closed]
    branches:
      - main
  issues:
    types: [closed]
  workflow_dispatch:
    inputs:
      contributor:
        description: 'GitHub username of contributor to reward'
        required: true
        type: string
      contribution_type:
        description: 'Type of contribution'
        required: true
        type: choice
        options:
          - pr_merged
          - issue_resolved
          - documentation
          - security_fix
          - feature_implementation
      reward_amount:
        description: 'Contribution points to record (simulation only; no token transfer)'
        required: false
        type: number
        default: 100

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  evaluate-contribution:
    name: Evaluate Contribution
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'issues' && github.event.issue.closed_at != null) ||
      github.event_name == 'workflow_dispatch'
    
    outputs:
      should_reward: ${{ steps.evaluate.outputs.should_reward }}
      contributor: ${{ steps.evaluate.outputs.contributor }}
      contribution_type: ${{ steps.evaluate.outputs.contribution_type }}
      reward_amount: ${{ steps.evaluate.outputs.reward_amount }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Evaluate Contribution
        id: evaluate
        uses: actions/github-script@v7
        with:
          script: |
            let shouldReward = false;
            let contributor = '';
            let contributionType = '';
            let rewardAmount = 0;
            
            // Manual dispatch
            if (context.eventName === 'workflow_dispatch') {
              shouldReward = true;
              contributor = '${{ inputs.contributor }}';
              contributionType = '${{ inputs.contribution_type }}';
              rewardAmount = ${{ inputs.reward_amount || 100 }};
            }
            
            // Pull request merged
            else if (context.eventName === 'pull_request' && context.payload.pull_request.merged) {
              const pr = context.payload.pull_request;
              contributor = pr.user.login;
              
              // Skip bot PRs
              if (contributor.includes('[bot]')) {
                console.log('Skipping bot PR');
                shouldReward = false;
              } else {
                shouldReward = true;
                
                // Determine contribution type and reward based on labels and size
                const labels = pr.labels.map(l => l.name);
                const additions = pr.additions || 0;
                const deletions = pr.deletions || 0;
                const changedFiles = pr.changed_files || 0;
                
                if (labels.includes('security')) {
                  contributionType = 'security_fix';
                  rewardAmount = 500;
                } else if (labels.includes('feature')) {
                  contributionType = 'feature_implementation';
                  rewardAmount = 300;
                } else if (labels.includes('documentation')) {
                  contributionType = 'documentation';
                  rewardAmount = 100;
                } else {
                  contributionType = 'pr_merged';
                  // Base reward on PR size
                  if (additions + deletions > 500) {
                    rewardAmount = 250;
                  } else if (additions + deletions > 100) {
                    rewardAmount = 150;
                  } else {
                    rewardAmount = 100;
                  }
                }
              }
            }
            
            // Issue closed
            else if (context.eventName === 'issues') {
              const issue = context.payload.issue;
              contributor = issue.user.login;
              
              // Only reward if closed by someone else (issue was resolved)
              if (issue.closed_by && issue.closed_by.login !== contributor) {
                shouldReward = true;
                contributionType = 'issue_resolved';
                
                const labels = issue.labels.map(l => l.name);
                if (labels.includes('security')) {
                  rewardAmount = 400;
                } else if (labels.includes('bug')) {
                  rewardAmount = 150;
                } else {
                  rewardAmount = 100;
                }
              }
            }
            
            core.setOutput('should_reward', shouldReward);
            core.setOutput('contributor', contributor);
            core.setOutput('contribution_type', contributionType);
            core.setOutput('reward_amount', rewardAmount);
            
            console.log(`Should reward: ${shouldReward}`);
            console.log(`Contributor: ${contributor}`);
            console.log(`Type: ${contributionType}`);
            console.log(`Amount: ${rewardAmount}`);

  record-simulated-points:
    name: Record Simulated Contribution Points
    runs-on: ubuntu-latest
    needs: evaluate-contribution
    if: needs.evaluate-contribution.outputs.should_reward == 'true'
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Record Simulated Contribution Points
        id: distribute
        run: |
          echo "## Simulated Contribution Points" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Contributor:** @${{ needs.evaluate-contribution.outputs.contributor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Contribution type:** ${{ needs.evaluate-contribution.outputs.contribution_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Points:** ${{ needs.evaluate-contribution.outputs.reward_amount }}" >> $GITHUB_STEP_SUMMARY
          echo "**Execution:** SIMULATED ONLY" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No wallet signature, RPC call, contract call, mint, transfer, payout, or transaction hash was created." >> $GITHUB_STEP_SUMMARY

      - name: Post Reward Notification
        uses: actions/github-script@v7
        with:
          script: |
            const contributor = '${{ needs.evaluate-contribution.outputs.contributor }}';
            const contributionType = '${{ needs.evaluate-contribution.outputs.contribution_type }}';
            const points = '${{ needs.evaluate-contribution.outputs.reward_amount }}';

            const comment = `## Contribution Points Recorded

            Congratulations @${contributor} — your contribution has been recorded in the pilot scoring workflow.

            **Contribution type:** ${contributionType.replace(/_/g, ' ')}
            **Points:** ${points}
            **Execution:** SIMULATED ONLY

            No CHX tokens were minted or transferred. No wallet was signed, no contract was called, no payout was created, and no transaction hash exists. These points are an internal pilot score, not a token balance, financial asset, or guaranteed payment.

            ---

            ScrollVerse contributor recognition • Simulation only`;

            if (context.eventName === 'pull_request') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: comment
              });
            } else if (context.eventName === 'issues') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: comment
              });
            }

      - name: Reward Summary
        run: |
          echo "## Contribution Points Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Contributor:** @${{ needs.evaluate-contribution.outputs.contributor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** ${{ needs.evaluate-contribution.outputs.contribution_type }}" >> $GITHUB_STEP_SUMMARY
          echo "**Points:** ${{ needs.evaluate-contribution.outputs.reward_amount }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** SIMULATED ONLY — no token mint or transfer" >> $GITHUB_STEP_SUMMARY
